services:
  - type: web
    name: campusanswer-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    disk:
      name: campusanswer-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: CAMPUSANSWER_AUTH_DATABASE
        value: /var/data/auth-sessions.sqlite
      - key: CAMPUSANSWER_PROFILE_DATABASE
        value: /var/data/auth-sessions.sqlite
      - key: CAMPUSANSWER_DOCUMENTS_DIR
        value: /var/data/documents
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_ADMIN_EMAILS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CAMPUSANSWER_CORS_ORIGINS
        sync: false
