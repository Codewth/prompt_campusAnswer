services:
  - type: web
    name: campusanswer-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: CAMPUSANSWER_REQUIRE_CLOUD_STORAGE
        value: "true"
      - key: SUPABASE_STORAGE_BUCKET
        value: campusanswer-documents
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_ADMIN_EMAILS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CAMPUSANSWER_CORS_ORIGINS
        sync: false
